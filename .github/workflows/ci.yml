name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend:
    name: Backend (Python / Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: winnie_test
          POSTGRES_USER: winnie
          POSTGRES_PASSWORD: winnie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements/development.txt

      - name: Run migrations
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: winnie_test
          DB_USER: winnie
          DB_PASSWORD: winnie
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379
          QR_SECRET_KEY: ci-qr-secret-key-32-chars-minimum
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          DJANGO_SETTINGS_MODULE: core.settings.test
        run: python manage.py migrate --check || python manage.py migrate

      - name: Run pytest with coverage
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: winnie_test
          DB_USER: winnie
          DB_PASSWORD: winnie
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379
          QR_SECRET_KEY: ci-qr-secret-key-32-chars-minimum
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          DJANGO_SETTINGS_MODULE: core.settings.test
        # pytest.ini addopts supplies --cov-fail-under=80; adding -q for brevity.
        run: pytest -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node / Vite / Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        # vite.config.js defines thresholds (lines: 35, branches: 60,
        # functions: 40, statements: 35). Build fails if thresholds are not met.
        run: npx vitest run --coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Build
        run: npm run build

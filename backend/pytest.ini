[pytest]
DJANGO_SETTINGS_MODULE = core.settings.test
# Keep DEBUG=True during tests so URL patterns gated on settings.DEBUG
# (e.g. drf-spectacular schema and swagger endpoints in core.urls) remain
# registered and testable. pytest-django defaults to DEBUG=False otherwise.
django_debug_mode = true
python_files = tests.py test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --cov=apps --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=80
